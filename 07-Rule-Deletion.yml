---
- name: Delete Checkpoint access rule
  hosts: Remote_CMA
  connection: httpapi
  gather_facts: false

  tasks:
    - name: Delete access rule by name
      check_point.mgmt.cp_mgmt_access_rule:
        state: absent
        name: "{{ rule_name }}"
        layer: "REMOTE_POLICY NETWORK"
        auto_publish_session: true

    - name: Confirm rule deletion
      ansible.builtin.debug:
        msg: "Rule '{{ rule_name }}' has been deleted from layer 'REMOTE_POLICY NETWORK'."
